name: Plan Bunny.net Storage Zones

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.tf'
      - 'variables.tf'
      - 'outputs.tf'
      - 'modules/**'
      - '.github/workflows/deploy-storage.yml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1

      - name: Initialize OpenTofu
        run: tofu init
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}

      - name: Plan infrastructure changes
        run: tofu plan
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
